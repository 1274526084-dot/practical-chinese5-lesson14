tern":"万｜千｜百｜十｜个\n15,000＝一万五千","meaning":"先说大数位，再说小数位。空着的数位用“零”连接。","warning":"末尾的零不读；中间连续几个零通常只读一个。车次、座位、电话号码按编号说法读，不能照搬金额读法。","details":["读金额：先划分万、千、百、十、个。","读年份、电话号码、车次和座位号时，先确认这是金额还是编号。"]},"examples":[{"photo":"bag","situation":"提包里装着15,000元。","prompt":"这是多少钱？","model":"提包里有一万五千元。","reason":"一万加五千，是15000。"},{"photo":"station","situation":"工作人员登记一件物品，旅客说明价格是1,005元。","prompt":"怎样读这个金额？","model":"这件物品是一千零五元。","reason":"百位和十位都空着，只读一个零。"},{"photo":"taxi","situation":"故事中，旅客递出100元，车费是19元。","prompt":"递出的钱和车费分别怎样说？","model":"我给了一百元，车费是十九元。","reason":"递出100元，不代表花了100元。"},{"photo":"railLostFound","situation":"模拟失物登记：旅客说包内有20,500元。","prompt":"你怎样复述核对金额？","model":"请确认：您说的是两万零五百元，对吗？","reason":"读完整金额，再请旅客确认。"}],"bookExamples":["101：一百零一；110：一百一十。","1,001：一千零一；2,020：两千零二十。","10,008：一万零八；153,000：十五万三千。","43,950,080：四千三百九十五万零八十。"],"textbook":"教材以例表呈现百、千、万的读法。下面保留部分教材数字，完整例表见原页；“○”在课件中写作“零”。","questions":[{"question":"15,000元应读作：","choices":["一千五百元","一万五千元","十五万元"],"answer":"一万五千元","explanation":"一万＋五千＝15000。"},{"question":"1,005元应读作：","choices":["一千零五元","一千五十元","一百零五元"],"answer":"一千零五元","explanation":"中间空着数位，只说一个零。"},{"question":"哪两种读法都能表达2,004？","choices":["两千零四／二千零四","两千四十／二千四十","两百零四／二百零四"],"answer":"两千零四／二千零四","explanation":"两千、二千都可以，后面是零四。"},{"question":"旅客说“二十元”。这里的“二”能换成“两”吗？","choices":["能，读两十元","不能，十位用二","要读两零元"],"answer":"不能，十位用二","explanation":"二十的二不换成两。"}],"rails":[{"photo":"railLostFound","prompt":"模拟登记：包内有10,008元，请复述核对。","sample":"您包内有一万零八元，对吗？","reason":"金额要说完整，再请对方确认。"},{"photo":"railSeat","prompt":"旅客说手机价格为2,020元，请复述。","sample":"您的手机是两千零二十元，对吗？","reason":"这里是价格，不是座位编号。"}],"keys":["万","千","百","零"],"eyebrow":"课文"},{"section":"text","eyebrow":"课文","title":"乘车付款：为什么稍微放心？","source":"教材第148页","instruction":"听本段，找原句，再回答问题。","kind":"segment","teacher":"旁题答案见本页理解题。第二段付费只是故事金额，不作为现在出租车收费标准。","audioKey":"seg2","audioLabel":"精读第2部分（教材原声）","audioHint":"教材原声已内置，断网也能播放，可拖动进度条反复听。","audioText":"司机二十多岁，挺和气，车里干干净净，看样子是个认真的人。我稍微放了点儿心。司机一边开车一边和我聊天儿，很快就到了医院。\n\n我紧张地给了他一百元，问：“够吗？”\n\n“十九块。”司机说。\n\n还不太贵，我赶紧付了钱，就往医院跑。","transcript":"司机二十多岁，挺和气，车里干干净净，看样子是个认真的人。我稍微放了点儿心。司机一边开车一边和我聊天儿，很快就到了医院。\n\n我紧张地给了他一百元，问：“够吗？”\n\n“十九块。”司机说。\n\n还不太贵，我赶紧付了钱，就往医院跑。","notes":[],"questions":[{"question":"司机是个什么样的人？“我”为什么放心了？","choices":["二十多岁，态度和气，车里干净，看起来认真","二十多岁，一直很不耐烦","从来不打扫车里"],"answer":"二十多岁，态度和气，车里干净，看起来认真","explanation":"这些细节让他稍微放心。"},{"question":"付钱的时候，“我”为什么紧张？","choices":["第一次打的，又怕车费太贵","他已经知道车费只有十九块","他不需要去医院"],"answer":"第一次打的，又怕车费太贵","explanation":"他先问一百元“够吗”，后来听到十九块才觉得不太贵。"},{"question":"这次车费是多少钱？","choices":["十九元","一百元","一万五千元"],"answer":"十九元","explanation":"递出一百元，不等于车费一百元。"}],"professional":"","imageAlt":"精读2：稍微放心，车费十九块","imageCaption":"AI生成的课文情境插图；用于帮助理解，人物不是作者真实肖像。","photo":"taxi"},{"kind":"workshop","section":"text","title":"稍微：只变化一点儿","anchor":"我稍微放了点儿心。","source":"教材第148页","instruction":"看情境说一说，再讲解、练习。","teacher":"先给学生说的时间，再显示参考句。例句重点标红，教材解释与原页可展开；练习接受已列出的合理答案，用简单的话解释。","bookPages":[148],"grammar":{"pattern":"稍微＋动词＋一下\n稍微＋形容词＋一点儿","meaning":"程度不深、数量不多，就是“一点点”。","warning":"稍微放了心，不等于完全放心；比较时“稍微”在形容词前，“一点儿”在形容词后。","details":[]},"examples":[{"photo":"station","situation":"走了很久，有一点儿累。","prompt":"你想怎么休息？","model":"我想稍微休息一下。","reason":"只休息一小会儿。"},{"photo":"taxi","situation":"看到车内干净，司机说话和气。","prompt":"课文中的“我”心情怎样变了？","model":"我稍微放了点儿心。","reason":"放心了一点，还没完全放心。"},{"photo":"railSeat","situation":"旅客听不清你说的话。","prompt":"怎样说明你要调整音量？","model":"我稍微说大声一点儿。","reason":"只把声音提高一点，仍然保持礼貌。"},{"photo":"railLuggage","situation":"行李挡住了通道，需要挪一点。","prompt":"你怎样礼貌请求旅客配合？","model":"麻烦您把行李稍微往里放一点儿。","reason":"只往里挪一点，不是整个搬走。"}],"bookExamples":["我想稍微休息一下。","他比我稍微高一点儿。","我对这儿的天气稍微有点儿不习惯。"],"textbook":"副词，表示数量不多或程度不深。","questions":[{"question":"我想____休息一下。","choices":["稍微","一点儿","非常多"],"answer":"稍微","explanation":"稍微放在休息前。"},{"question":"这个箱子比那个重____。","choices":["稍微","一点儿","一点儿稍微"],"answer":"一点儿","explanation":"一点儿放在重后面。"},{"question":"“稍微放心了”表示：","choices":["完全不担心了","放心了一些","一点都没放心"],"answer":"放心了一些","explanation":"程度不深，只变化一点。"},{"question":"哪两句都自然？","choices":["请稍微等一下／请等一下","请一点儿等／请等一点儿稍微","请稍微很等／请很等"],"answer":"请稍微等一下／请等一下","explanation":"两句都能请求短暂等待。稍微更突出时间短。"}],"rails":[{"photo":"railSeat","prompt":"旅客没听清，请用“稍微”调整表达。","sample":"我稍微说慢一点儿，您看可以吗？","reason":"这里说速度略慢一些。"},{"photo":"railLuggage","prompt":"请旅客将通道边的箱子向里挪一点。","sample":"麻烦您把箱子稍微往里放一点儿。","reason":"请求清楚、语气和气。"}],"keys":["稍微","一点儿","一下"],"eyebrow":"课文"},{"section":"text","eyebrow":"课文","title":"提包不见了：这可怎么办？","source":"教材第148—149页","instruction":"听本段，找原句，再回答问题。","kind":"segment","teacher":"旁题答案见本页理解题。让学生说“原文写了什么”，把人物担心与后来发生的事分开。","audioKey":"seg3","audioLabel":"精读第3部分（教材原声）","audioHint":"教材原声已内置，断网也能播放，可拖动进度条反复听。","audioText":"“不好！”进了医院，我才发现，装钱的提包被我忘在出租车里了。我急忙跑出去追，车已经开走了。这可怎么办？连车牌号也没记住，也不知道司机叫什么名字，这么大的天津，上哪儿去找？一万五千块钱被弄丢了，孩子住院等着用钱呢，这可怎么办？这可怎么办？我真恨自己！","transcript":"“不好！”进了医院，我才发现，装钱的提包被我忘在出租车里了。我急忙跑出去追，车已经开走了。这可怎么办？连车牌号也没记住，也不知道司机叫什么名字，这么大的天津，上哪儿去找？一万五千块钱被弄丢了，孩子住院等着用钱呢，这可怎么办？这可怎么办？我真恨自己！","notes":[],"questions":[{"question":"进了医院，“我”发现了什么？","choices":["装钱的提包忘在了出租车里","司机留在医院等他","孩子已经出院"],"answer":"装钱的提包忘在了出租车里","explanation":"进了医院以后才发现。"},{"question":"“我”有办法把钱找回来吗？","choices":["当时不知道怎么找：没车牌号，也不知道司机名字","已经记住所有联系信息","已经与司机约好见面"],"answer":"当时不知道怎么找：没车牌号，也不知道司机名字","explanation":"他当时感到无助，后来是司机主动联系他。"},{"question":"这一部分用了三个“这可怎么办”表达了“我”怎样的心情？","choices":["焦急、无助，又责怪自己","轻松愉快","觉得很好笑"],"answer":"焦急、无助，又责怪自己","explanation":"孩子等着用钱，他又想不到找回的办法。"}],"professional":"","imageAlt":"精读3：提包忘了，怎么办","imageCaption":"AI生成的课文情境插图；用于帮助理解，人物不是作者真实肖像。","photo":"bag"},{"kind":"workshop","section":"text","title":"被字句：先说东西发生了什么","anchor":"装钱的提包被我忘在出租车里了。","source":"教材第150—151页","instruction":"看情境说一说，再讲解、练习。","teacher":"先给学生说的时间，再显示参考句。例句重点标红，教材解释与原页可展开；练习接受已列出的合理答案，用简单的话解释。","bookPages":[150,151],"grammar":{"pattern":"东西／人＋被＋谁＋动作＋结果\n东西／人＋没＋被＋动作＋结果","meaning":"把受到影响的东西或人放在前面，再说它发生了什么。","warning":"先找“谁受到影响”。不能说“被不……”；动词后通常要说结果、去处或其他内容。","details":["① 先换主角：同学借走我的书 → 我的书被同学借走了。","② 说清结果：借走了、弄坏了、忘在车里了。","③ 省略人：那本词典被借走了；“让／叫”后要保留做事的人。","④ 否定位置：没／没有＋被；本课用没，不用“被不”。"]},"examples":[{"photo":"bag","situation":"我把提包忘在出租车里。现在先说提包。","prompt":"提包怎么样了？","model":"提包被我忘在出租车里了。","reason":"先说提包，再说我把它忘在哪里。"},{"photo":"railLuggageBay","situation":"两位旅客的箱子一样，已经确认其中一人误拿了。","prompt":"先说箱子，怎样报告？","model":"行李箱被另一位旅客拿错了。","reason":"箱子是受影响的东西；拿错说出结果。"},{"photo":"railLostFound","situation":"工作人员已经找到遗失的手机。","prompt":"先说手机，怎样安慰旅客？","model":"您的手机已经被工作人员找到了。","reason":"被字句也能说找回这样的好结果。"},{"photo":"railSeat","situation":"旅客担心电脑坏了，检查后发现没坏。","prompt":"先说电脑，怎样回答？","model":"您的电脑没被弄坏。","reason":"没放在被前；也可以不说是谁弄的。"}],"bookExamples":["我的书被/让/叫同学借走了。","电脑被/让/叫我弄坏了。","小偷被/让/叫警察抓住了。","那本词典被借走了。","他被打了。","我的自行车被偷了。","我的电脑没被弄坏。","小王从来没被/让/叫老师批评过。"],"textbook":"“被”，在口语中也可以用“让”或“叫”。有时做事的人并不出现，用来强调结果。这样的句子中的“被”不能用“让”和“叫”替换。注意：否定词要放在“被”前。","questions":[{"question":"“我的书被同学借走了。”是谁借书？","choices":["我","同学","书"],"answer":"同学","explanation":"被后面的同学是做动作的人。"},{"question":"哪句话正确？","choices":["电脑被没弄坏。","电脑没被弄坏。","电脑被不弄坏了。"],"answer":"电脑没被弄坏。","explanation":"否定词没放在被前。"},{"question":"不说明谁借书时，可以说：","choices":["我的书被借走了。","我的书让借走了。","我的书叫借走了。"],"answer":"我的书被借走了。","explanation":"被后可以不说做事的人；本课让、叫后要说人。"},{"question":"已经确认旅客拿错了箱子。哪句话对应？","choices":["箱子把旅客拿错了。","箱子被旅客拿错了。","旅客被箱子拿错了。"],"answer":"箱子被旅客拿错了。","explanation":"箱子受影响，所以箱子在前。"},{"question":"“手机被工作人员找到了”说明被字句：","choices":["只能说坏事","也可以说好的结果","只能说找不到"],"answer":"也可以说好的结果","explanation":"这里手机找到了，是好结果。"}],"rails":[{"photo":"railLuggageBay","prompt":"已确认同款箱子被误拿。请向同事报告。","sample":"这位旅客的箱子被另一位旅客拿错了。","reason":"确认后再说发生了什么。"},{"photo":"railLostFound","prompt":"手机已找到。请向旅客说明，再请他核对。","sample":"您的手机已经被找到了，请核对一下。","reason":"不知道或不必说谁找到时，被后的人可省。"}],"keys":["没有","没","被","让","叫","借走","弄坏","拿错","找到"],"eyebrow":"课文"},{"kind":"media","section":"text","title":"52秒：失物被找回来了","instruction":"带着一个问题看短片，再说一句。","source":"央视网 · 第一时间","teacher":"打开官方原页播放。按页面提示选看片段；如暂时不能联网，使用图片和备用提问继续。视频不提前揭晓课文答案。","media":[{"id":"police","title":"旅客财物遗失，铁路警方协助找回","publisher":"央视网 · 第一时间","url":"https://tv.cctv.com/2025/01/01/VIDEAwaNtcNQvb90yZgXRWBc250101.shtml","task":"全片52秒：找回的物品可以怎样用被字句说明？","backup":"看图用“手机被找到了”说明结果。"}],"eyebrow":"课文"},{"section":"text","eyebrow":"课文","title":"司机还包：印象怎样改变？","source":"教材第149页","instruction":"听本段，找原句，再回答问题。","kind":"segment","teacher":"旁题答案见本页理解题。第四段分角色读，表现焦急、安慰、感谢与善意提醒。","audioKey":"seg4","audioLabel":"精读第4部分（教材原声）","audioHint":"教材原声已内置，断网也能播放，可拖动进度条反复听。","audioText":"这时手机突然响了起来，这么晚了，谁呢？\n\n“喂，是李先生吗？”\n\n“是啊。你是……”\n\n“我是出租车司机小刘，您把包忘在我的车里了。您别着急，我马上给您送过去！”\n\n十分钟后，小刘果然来了，手里拿着那个被我忘在车里的提包。\n\n“幸好您的包里有电话号码，才和您联系上。给您包，快看看少了什么没有。”\n\n我赶紧打开提包，一看，一万五千块，一分也不少。\n\n“幸好遇到的是您啊！真是太谢谢你了……”我的眼泪都快流出来了。\n\n“谢什么！这是我应该做的。以后可得小心啊！再见啦！”\n\n我拿出五百块钱给他，可他就是不要。多好的人啊！这次坐出租车的经历，使我改变了对出租车司机的印象。\n\n（选自《驾驶员》，作者：李果）","transcript":"这时手机突然响了起来，这么晚了，谁呢？\n\n“喂，是李先生吗？”\n\n“是啊。你是……”\n\n“我是出租车司机小刘，您把包忘在我的车里了。您别着急，我马上给您送过去！”\n\n十分钟后，小刘果然来了，手里拿着那个被我忘在车里的提包。\n\n“幸好您的包里有电话号码，才和您联系上。给您包，快看看少了什么没有。”\n\n我赶紧打开提包，一看，一万五千块，一分也不少。\n\n“幸好遇到的是您啊！真是太谢谢你了……”我的眼泪都快流出来了。\n\n“谢什么！这是我应该做的。以后可得小心啊！再见啦！”\n\n我拿出五百块钱给他，可他就是不要。多好的人啊！这次坐出租车的经历，使我改变了对出租车司机的印象。\n\n（选自《驾驶员》，作者：李果）","notes":[],"questions":[{"question":"谁来的电话？有什么事？","choices":["司机小刘，要送回提包","妻子，要再借钱","警察，要他买车"],"answer":"司机小刘，要送回提包","explanation":"小刘主动打电话让他别着急。"},{"question":"司机是怎么找到“我”的？把包给了“我”以后，司机让“我”干什么？","choices":["包里有电话号码；让他检查有没有少东西","看见车牌号；让他交停车费","在网上认识；让他再借钱"],"answer":"包里有电话号码；让他检查有没有少东西","explanation":"司机请他当面核对物品。"},{"question":"“我”用什么感谢司机？","choices":["想给五百元，司机没有收","给了司机一万五千元","只说了再见，没有感谢"],"answer":"想给五百元，司机没有收","explanation":"人物说了感谢，也提出用钱感谢。"},{"question":"这次坐出租车的经历，对“我”有什么影响？","choices":["改变了他对出租车司机的印象","让他更不相信这位司机","让他忘记了司机的帮助"],"answer":"改变了他对出租车司机的印象","explanation":"司机归还钱物的行动改变了他的看法。"}],"professional":"","imageAlt":"精读4：包回来了，印象改变了","imageCaption":"AI生成的课文情境插图；用于帮助理解，人物不是作者真实肖像。","photo":"taxi","photoPair":["taxi","bag"]},{"kind":"workshop","section":"text","title":"果然：结果和原来想的一样","anchor":"十分钟后，小刘果然来了。","source":"教材第149页","instruction":"看情境说一说，再讲解、练习。","teacher":"先给学生说的时间，再显示参考句。例句重点标红，教材解释与原页可展开；练习接受已列出的合理答案，用简单的话解释。","bookPages":[149],"grammar":{"pattern":"先有预想 → 后来真的这样\n预想……，果然……","meaning":"原来这样想，结果真的这样。","warning":"第一次看到一件事、以前没有预想时，不一定适合用果然。“看样子”是根据眼前情况推测，果然要有结果。","details":[]},"examples":[{"photo":"rain","situation":"天气预报说有雨，出门后真的下雨了。","prompt":"结果和预报一样，怎样说？","model":"天气预报说有雨，果然下雨了。","reason":"先有预报，再看到结果。"},{"photo":"taxi","situation":"小刘说十分钟后到，十分钟后他来了。","prompt":"怎样联系承诺和结果？","model":"他说十分钟后到，果然来了。","reason":"先说要来，后来真的来了。"},{"photo":"rural","situation":"朋友说桂林很美，你去了觉得真的很美。","prompt":"你可以怎样说？","model":"都说桂林很美，来了一看果然很美。","reason":"结果与听到的说法一致。"},{"photo":"railLostFound","situation":"同事说手机在服务台，核查后真的在那里。","prompt":"向同事怎样说明？","model":"你说手机在服务台，果然在那里。","reason":"核实后，预想得到证实。"}],"bookExamples":["天气预报说今天有雨，果然下雨了。","我说她会来，果然来了吧。"],"textbook":"副词，表示结果和预想的一样。做状语。","questions":[{"question":"他说十分钟后到，十分钟后____来了。","choices":["果然","幸好不","稍微一点儿"],"answer":"果然","explanation":"结果和他说的一样。"},{"question":"哪种情况最适合用果然？","choices":["以前听说这里很美，来了一看真的很美","完全没有预想，也没有比较","还没发生，不知道结果"],"answer":"以前听说这里很美，来了一看真的很美","explanation":"先有预想，再看到一样的结果。"},{"question":"“看样子他很着急”是：","choices":["已证实以前的预想","根据眼前情况推测","坚决不改变"],"answer":"根据眼前情况推测","explanation":"看样子在猜；果然是在核对结果。"},{"question":"同事说物品在服务台，核实后真的找到了。最合适的是：","choices":["果然在服务台找到了。","稍微在服务台找到了。","就是才服务台。"],"answer":"果然在服务台找到了。","explanation":"找到的地点与之前知道的一样。"}],"rails":[{"photo":"railLostFound","prompt":"同事说钱包在失物招领处，核查后找到了，怎样转述？","sample":"钱包果然在失物招领处找到了。","reason":"先有消息，再有核查结果。"},{"photo":"railLuggageBay","prompt":"旅客说包可能在行李架上，检查后找到。","sample":"检查以后，包果然在行李架上。","reason":"对旅客说已经核实的结果。"}],"keys":["果然","预想","结果"],"eyebrow":"课文"},{"kind":"workshop","section":"text","title":"幸好：好条件避免了坏结果","anchor":"幸好您的包里有电话号码，才和您联系上。","source":"教材第151页","instruction":"看情境说一说，再讲解、练习。","teacher":"先给学生说的时间，再显示参考句。例句重点标红，教材解释与原页可展开；练习接受已列出的合理答案，用简单的话解释。","bookPages":[151],"grammar":{"pattern":"幸好＋好条件，才＋结果。\n不好的情况，幸好＋好条件。","meaning":"本来可能发生麻烦，因为有这个好条件，麻烦避免了。","warning":"幸好没去、幸好没弄丢都可以；不能把幸好本身改成“不幸好”。也不是每句都必须有才。","details":[]},"examples":[{"photo":"rain","situation":"雨很大，你出门时带了伞。","prompt":"为什么没有被淋湿？","model":"雨下得真大，幸好我带了伞。","reason":"有伞这个好条件，避免淋湿。"},{"photo":"station","situation":"快到开车时间了，同学提醒你进站。","prompt":"你为什么没有误车？","model":"幸好同学提醒，我才赶上了火车。","reason":"提醒是好条件，赶上火车是结果。"},{"photo":"railLostFound","situation":"包里有联系电话，工作人员联系到了失主。","prompt":"怎样说明号码的重要？","model":"幸好包里有电话号码，我们才联系上失主。","reason":"有号码，才方便联系。"},{"photo":"railLuggageBay","situation":"下车前检查行李，发现手机还在座位上。","prompt":"你可以怎样说？","model":"幸好下车前检查了，我才没把手机落在车上。","reason":"检查避免了遗忘。"}],"bookExamples":["时间这么紧，幸好今天是星期天，车不太多。","雨下得真大，幸好我们带伞了。","幸好今天不堵车，我们才赶上了飞机。"],"textbook":"“幸好”指出由于某种有利的条件而幸运地避免了不好的后果。含“庆幸”的意思。有时与“才”搭配使用。没有否定式。","questions":[{"question":"____有你带路，我们才不用担心迷路。","choices":["幸好","不幸好","果然不"],"answer":"幸好","explanation":"有人带路，避免迷路。"},{"question":"幸好包里有号码，____和失主联系上。","choices":["才","被","从来"],"answer":"才","explanation":"有号码是能联系上的条件。"},{"question":"哪句话可以说？","choices":["不幸好我去。","幸好我没去。","幸好不才去。"],"answer":"幸好我没去。","explanation":"没去是值得庆幸的事，否定的是去。"},{"question":"“雨很大，幸好我带了伞”能不说“才”吗？","choices":["能，意思已经清楚","不能，幸好后一定要有才","必须改成果然"],"answer":"能，意思已经清楚","explanation":"幸好可以单独表达庆幸，不必每次带才。"}],"rails":[{"photo":"railLostFound","prompt":"旅客带着物品照片来认领。用幸好说明帮助。","sample":"幸好您有照片，我们才能更快核对物品。","reason":"照片是有利条件，不代表一定不用其他核对。"},{"photo":"railSeat","prompt":"你下车前检查手机，避免落下。","sample":"幸好下车前检查了一下，我才没把手机落在车上。","reason":"说清好条件与避免的麻烦。"}],"keys":["幸好","才","没"],"eyebrow":"课文"},{"kind":"workshop","section":"text","title":"就是：坚持这样，不改变","anchor":"我拿出五百块钱给他，可他就是不要。","source":"教材第149页","instruction":"看情境说一说，再讲解、练习。","teacher":"先给学生说的时间，再显示参考句。例句重点标红，教材解释与原页可展开；练习接受已列出的合理答案，用简单的话解释。","bookPages":[149],"grammar":{"pattern":"别人劝／要求……，可是他就是＋要／不……","meaning":"别人怎么说，他仍然坚持自己的想法。","warning":"这里的就是表示坚决，与“不是A就是B”的两个可能不同。乘务交流用它转述情况，面对旅客要耐心、礼貌。","details":[]},"examples":[{"photo":"taxi","situation":"旅客想给钱表示感谢，司机坚决不收。","prompt":"怎样说司机的态度？","model":"我想给他钱，可他就是不要。","reason":"不是暂时没收，而是坚持不收。"},{"photo":"station","situation":"大家劝同学休息，他坚持继续学习。","prompt":"怎样说他的态度？","model":"大家都劝他休息，他就是不休息。","reason":"别人劝了，他没有改变。"},{"photo":"railSeat","situation":"旅客坚持找回原来的箱子，不愿先走。","prompt":"向同事怎样转述？","model":"旅客就是要先找到自己的箱子。","reason":"转述他坚持的需求，再耐心协助。"},{"photo":"railLostFound","situatio ，他仍然坚持自己的想法。","example":"我想给他钱，可他就是不要。"}],"eyebrow":"语法"},{"kind":"media","section":"grammar","title":"把汉语用在失物服务中","instruction":"看短片，再两人轮换说。","source":"央视新闻 · 职业运用","teacher":"围绕描述物品、联系与核对进行语言练习。","media":[{"id":"howto","title":"坐火车遗失物品，怎样快速找回","publisher":"央视新闻","url":"https://news.cctv.cn/2025/08/25/ARTIJGQAjNu9lLxb4VuZOVxv250825.shtml","task":"选看约1分钟：需要向工作人员说清哪些细节？","backup":"用物品、时间、地点三个词说明情况。"}],"rails":[{"photo":"railLuggageBay","prompt":"旅客：我找不到黑色提包了。工作人员先问什么？","sample":"请您别着急。您最后一次看到提包是在什么地方？","reason":"先问清情况，再给出帮助。"},{"photo":"railLostFound","prompt":"找到物品后，请说明结果、请旅客核对，再回应感谢。","sample":"您的提包已经被找到了。请核对一下。不客气，这是我们应该做的。","reason":"把描述、核对与礼貌回应连起来。"}],"eyebrow":"语法"},{"section":"practice","eyebrow":"课后练习","title":"综合一：书包、钱包、提包、背包","source":"教材第152页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"参考：1书包/旅行包；2钱包；3提包/背包。第1题按题目上课/旅行的用途选择；真实生活中的同一个包也可以兼用。","questions":[{"question":"1. 这个包，平时上课的时候是（ ），去旅行的时候是（ ）。","choices":["书包；旅行包","钱包；书包"],"answer":"书包；旅行包","explanation":"上课装学习用品叫书包，旅行用叫旅行包。"},{"question":"2. 【课后】到了商店我才发现，我忘了带（ ），什么也买不了。","choices":["钱包","书包"],"answer":"钱包","explanation":"这里说到了商店才发现没带钱，常用“钱包”。"},{"question":"3. （ ）是提在手里的包，（ ）是背在背上的包。","choices":["提包；背包","背包；提包"],"answer":"提包；背包","explanation":"提在手里叫提包，背在背上叫背包。"}]},{"section":"practice","eyebrow":"课后练习","title":"综合二：课文词语第1—5题","source":"教材第152—153页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"词库：印象、严重、联系、幸好、弄、看样子、从来、果然、经历。参考：1看样子；2联系；3弄；4经历；5严重。 第1题教材参考“看样子”；如果已有预想，也接受“果然”，请学生说清自己想表达什么。","questions":[{"question":"1. 【课内】（ ）他不懂汉语，问他什么都摇头。","choices":["看样子","幸好","果然"],"answer":"看样子","explanation":"“看样子”是根据他摇头来判断。“果然”也可以，但要有原来就认为他不懂汉语的意思。","acceptedAnswers":["果然"]},{"question":"2. 【课后】有事情跟我（ ），这是我的电话号码。","choices":["联系","印象","严重"],"answer":"联系","explanation":"“跟我联系”是常用搭配。"},{"question":"3. 【课内】钱包被我（ ）丢了。","choices":["弄","经历","果然"],"answer":"弄","explanation":"“弄丢”表示因为某种行为使东西丢了。"},{"question":"4. 【课后】他给我们讲了他的旅行（ ），很有意思。","choices":["经历","严重","联系"],"answer":"经历","explanation":"“旅行经历”说旅行中遇到的事情。"},{"question":"5. 【课后】他的病不太（ ），您别担心。","choices":["严重","印象","幸好"],"answer":"严重","explanation":"病不太严重，所以让对方别担心。"}]},{"section":"practice","eyebrow":"课后练习","title":"综合二：课文词语第6—9题","source":"教材第152—153页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"词库：印象、严重、联系、幸好、弄、看样子、从来、果然、经历。参考：6幸好；7从来；8果然；9印象。","questions":[{"question":"6. 【课内】考试时我忘了带笔，（ ）我的同桌带了两支笔。","choices":["幸好","从来","弄"],"answer":"幸好","explanation":"同桌多带一支笔，帮助我避免没笔的麻烦。"},{"question":"7. 【课后】我（ ）没坐过飞机，第一次坐，有点儿紧张。","choices":["从来","果然","印象"],"answer":"从来","explanation":"以前一次也没坐过，用“从来没……过”。"},{"question":"8. 【课内】来中国以前听说天安门广场很大，来了一看（ ）很大。","choices":["果然","弄","联系"],"answer":"果然","explanation":"以前听说很大，实际一看也很大，符合预想。"},{"question":"9. 【课后】他给我的第一（ ）很好。","choices":["印象","经历","严重"],"answer":"印象","explanation":"第一印象是刚见到时形成的感觉和看法。"}]},{"section":"practice","eyebrow":"课后练习","title":"综合三：谢/谢谢；匆忙/急忙","source":"教材第153页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"“急忙走过来”和“匆忙走过来”都可，前者强调及时来帮忙。“学习经验”说方法，“学习经历”说故事，两者有不同意思。参考答案允许合理多解。","questions":[{"question":"1(1) 【课后】（ ）你的帮助！","choices":["谢","谢谢"],"answer":"谢谢","explanation":"“谢谢你的帮助”是常用的感谢说法。"},{"question":"1(2) 【课后】（ ）什么！这是我应该做的。","choices":["谢","谢谢"],"answer":"谢","explanation":"“谢什么”表示不用谢，是口语说法。"},{"question":"2(1) 【课内】我走得太（ ）了，忘了带钱包。","choices":["匆忙","急忙"],"answer":"匆忙","explanation":"“太……了”在这里说走时很忙乱，用“匆忙”。"},{"question":"2(2) 【课内】看到我拿个大箱子，他（ ）走过来帮我。","choices":["匆忙","急忙"],"answer":"急忙","explanation":"“急忙”最能说出他马上来帮忙。“匆忙”也能说，重点是动作匆促。","acceptedAnswers":["匆忙"]}]},{"section":"practice","eyebrow":"课后练习","title":"综合三：稍微/一点儿；经历/经验","source":"教材第153页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"“急忙走过来”和“匆忙走过来”都可，前者强调及时来帮忙。“学习经验”说方法，“学习经历”说故事，两者有不同意思。参考答案允许合理多解。","questions":[{"question":"3(1) 【课内】我（ ）有点儿累。","choices":["稍微","一点儿"],"answer":"稍微","explanation":"“稍微”放在“有点儿累”前，说程度不深。"},{"question":"3(2) 【课内】这个比那个贵（ ）。","choices":["稍微","一点儿"],"answer":"一点儿","explanation":"形容词“贵”后面用“一点儿”，说差得不多。"},{"question":"4(1) 【课后】这次旅行的（ ）很难忘。","choices":["经历","经验"],"answer":"经历","explanation":"“经历”说亲自遇到的事情；这里说旅行中发生的事。"},{"question":"4(2) 【课内】你有什么好的学习（ ），给我们介绍一下。","choices":["经历","经验"],"answer":"经验","explanation":"“经验”说学到的方法，最贴合这句话。“经历”也能说，意思是介绍自己的学习故事。","acceptedAnswers":["经历"]}]},{"section":"practice","eyebrow":"课后练习","title":"综合四1：花 · 吹 · 落","source":"教材第153页","instruction":"点击词语，排成一句话。","kind":"order","teacher":"先按词块排出一句，再按教材用给定词自由造句。施事“风/他/我”只是参考，可换成合理的人或省略。","tokens":["吹落","风","花","了。","被"],"orderAnswer":["花","被","风","吹落","了。"],"feedback":"“花”受到动作影响，“风”使花落下来；口头也可以说“花被吹落了”。"},{"section":"practice","eyebrow":"课后练习","title":"综合四2：东西 · 寄 · 走","source":"教材第153页","instruction":"点击词语，排成一句话。","kind":"order","teacher":"先按词块排出一句，再按教材用给定词自由造句。施事“风/他/我”只是参考，可换成合理的人或省略。","tokens":["寄走","被","了。","东西","他"],"orderAnswer":["东西","被","他","寄走","了。"],"feedback":"知道做事的人时可以说“他”；不必说是谁时，可以说“东西被寄走了”。"},{"section":"practice","eyebrow":"课后练习","title":"综合四3：自行车钥匙 · 弄 · 丢","source":"教材第153页","instruction":"点击词语，排成一句话。","kind":"order","teacher":"先按词块排出一句，再按教材用给定词自由造句。施事“风/他/我”只是参考，可换成合理的人或省略。","tokens":["自行车钥匙","我","弄丢","被","了。"],"orderAnswer":["自行车钥匙","被","我","弄丢","了。"],"feedback":"“自行车钥匙”放前面，先说明它发生了什么；也可以不说“我”。"},{"section":"practice","eyebrow":"课后练习","title":"综合五：换个说法，意思不变","source":"教材第154页","instruction":"两人轮换，说清楚意思。","kind":"speak","teacher":"参考不唯一：1都说桂林很美，去桂林旅游一看，果然美极了；2对待工作和学习应该认真；3他刻苦学习，终于考上了理想的大学；4他不听朋友的话，就是不肯去医院看病；5幸好她帮助了我，我才找到了工作。不是每题只有这一种语序，意思不变即可。","prompts":["1. 【课内】都说桂林很美，去桂林旅游一看，真的美极了。（果然）","2. 【课后】对待工作和学习不应该马虎。（认真）","3. 【课后】他刻苦学习，到底考上了理想的大学。（终于）","4. 【课内】他不听朋友的话，坚决不肯去医院看病。（就是）","5. 【课内】因为她帮助了我，我才找到了工作。（幸好）"]},{"section":"practice","eyebrow":"课后练习","title":"综合六1：这些话什么时候说","source":"教材第154页","instruction":"选一选，再读完整句。","kind":"quiz","teacher":"教材本来是开放问题；选择题只是帮助理解。其他情境符合句意也可，不要求照背选项。","questions":[{"question":"(1) 谢什么！这是我应该做的。","choices":["帮助别人后，对方感谢你，你表示不用谢。","你请别人先还自己东西"],"answer":"帮助别人后，对方感谢你，你表示不用谢。","explanation":"别人感谢你时，这句表示不用谢。"},{"question":"(2) 没错，一分不少，太谢谢您了！","choices":["拿回丢失的钱，数过以后发现钱都在。","钱还没拿回来，也没检查"],"answer":"拿回丢失的钱，数过以后发现钱都在。","explanation":"“一分不少”说明已经核对过金额。"},{"question":"(3)【课后】以后可得小心啊！","choices":["对方因粗心出了问题，你善意提醒他。","你要求对方故意做错"],"answer":"对方因粗心出了问题，你善意提醒他。","explanation":"这是善意提醒，说话语气要友好。"}]},{"section":"practice","eyebrow":"课后练习","title":"综合六2：现在怎样回应","source":"教材第154页","instruction":"两人轮换，说清楚意思。","kind":"speak","teacher":"参考不唯一：1幸好遇到了你，我就不用担心迷路了；2谢什么！这是我应该做的；3那本书已经被我还给图书馆了。第3句“被我还给图书馆了”说明书已经归还，不能借给朋友。","prompts":["(1) 【课内】你迷了路，正在着急时遇到了同学，你觉得很幸运，你怎么说？（幸好）","(2) 【课后】别人感谢你，你觉得没什么，你该怎么说？（什么）","(3) 【课内】你把书还给了图书馆以后，你的朋友来向你借那本书，你该怎么说？（被）"]},{"section":"practice","eyebrow":"课后练习","title":"综合七：用原文说明人物的变化","source":"教材第154—155页","instruction":"两人轮换，说清楚意思。","kind":"speak","teacher":"参考：1. 教材问题提示“农村”。“我”的孩子病很严重，必须住院，所以借了一万五千块钱赶到天津。\n2. 车站没有公共汽车，又不认识路，先很着急；因听说而害怕坐出租车；见司机和气、车里干净，稍微放心了。\n3. 付钱前担心车费高，很紧张；知道只要十九块，觉得还不太贵，赶紧付款去医院。\n4. 忘了装钱的提包，没记住车牌号，也不知道司机姓名；天津很大，不知道去哪儿找，孩子还等着用钱。\n5. 赶紧打开包，看到钱一分不少，非常感动、感谢，眼泪快流出来了。 “来自农村”依教材本题提示说明；正文没有给出具体村名。","prompts":["1. 【本次课】“我”是从什么地方来到天津的？为什么到天津来？（农村；病；严重；住院；借钱）","2. 【已练，可回顾】“我”上车前后的心理有什么变化？请说一下。（着急；害怕；放心）","3. 【已练，可回顾】付钱前后“我”的心理又有什么变化？（紧张；赶紧；够吗；还不太贵）","4. 【本次课】发现钱丢了，“我”为什么恨自己？（没记住；不知道；这么大的天津；等着用钱）","5. 【本次课】司机送来钱以后，“我”又是怎样的心情？（赶紧；感谢；眼泪）"]},{"section":"practice","eyebrow":"课后练习","title":"综合八：拾金不昧，怎样感谢","source":"教材第155—156页","instruction":"先读，再找原文依据。","kind":"reading","teacher":"判断参考：对、文中没说清、不对、对、不对、文中没说清、文中没说清、文中没说清。文章“人人”按开头概括理解，不当作现实统计。区分钱包/提包；归还动机与实付金额文中未明。给钱与否的观点留到下一页讨论，不在这里补法律结论。","reading":"人人都有过丢东西的经历。丢东西的人都希望有人会“拾金不昧”（shí jīn bú mèi），把东西还回来。那么，对“拾金不昧”的人应不应该给钱表示感谢呢？\n\n故事一：\n王女士坐出租车时，不小心把钱包掉在了车上。按照发票上的电话，她找到了出租车司机。第二天，当师傅把钱包还给她的时候，她主动给了司机100元钱。\n王女士说：“钱包是我自己不小心掉的，司机给我送回来，应该付给他钱表示感谢。”\n\n故事二：\n李女士捡到一个提包，包里约有15万元的现金。几天后，李女士在报纸上看到一个寻物启事（xún wù qǐshì）：愿意花1.5万元找这个提包。可是当李女士把提包还给失主的时候，失主却没付给她1.5万元。\n\n对“拾金不昧”的人，应该怎么表示感谢？你们国家是怎么做的？有没有什么法律规定（fǎlǜ guīdìng）？","questions":[{"question":"所有的人都丢过东西。","choices":["对","不对","文中没说清"],"answer":"对","explanation":"按文章开头“人人都有过”判断。这是文章的概括，不是现实调查结论。"},{"question":"丢东西的人都拾金不昧。","choices":["对","不对","文中没说清"],"answer":"文中没说清","explanation":"希望别人还东西，不等于自己一定会还。"},{"question":"王女士在路上丢了皮包。","choices":["对","不对","文中没说清"],"answer":"不对","explanation":"她把钱包掉在出租车上。"},{"question":"出租车司机捡到了王女士的钱包。","choices":["对","不对","文中没说清"],"answer":"对","explanation":"钱包掉在车上，后来司机把它还给了她。"},{"question":"李女士捡到了一个钱包。","choices":["对","不对","文中没说清"],"answer":"不对","explanation":"课文说李女士捡到一个提包。"},{"question":"钱包里有很多钱。","choices":["对","不对","文中没说清"],"answer":"文中没说清","explanation":"王女士的钱包里有多少钱没有写；15万元在李女士捡到的提包里。"},{"question":"李女士是为了1.5万元的感谢费才把包还给了失主。","choices":["对","不对","文中没说清"],"answer":"文中没说清","explanation":"文中没有说她为什么归还，不能替她猜想。"},{"question":"失主给了李女士很多钱。","choices":["对","不对","文中没说清"],"answer":"文中没说清","explanation":"只说没付承诺的1.5万元，没有写实际付了多少。"}]},{"section":"practice","eyebrow":"课后练习","title":"课堂草稿：一段失而复得的经历","source":"教材第156页","instruction":"先写3—5句，课后修改。","kind":"exit","teacher":"本次课堂约6分钟，系统最低提醒30字，供3—5句草稿；课后按教材改成80字左右。参考开头：“有一次，我的钱包被我忘在……。我很着急。幸好……”。评价事情清楚、被/幸好用得自然、感谢表达得体。","body":["题目二选一：我归还过的失物 / 我的东西被还回来了。","先写：时间、地点、物品、经过、结果与感受。","可用句式：……被……；幸好……才……；我原来……后来……。","可用词：急忙、联系、放心、经历、印象。","课堂写草稿，课后修改为80字左右；没有亲身经历时，可注明“听说的故事”或“想象故事”。"],"placeholder":"有一次，……。我……。幸好……。最后……。","minChars":30},{"section":"practice","eyebrow":"课后练习","title":"学习出口与课后清单","source":"第2次课小结","instruction":"记下课后任务。","kind":"info","teacher":"课内题量与两份教案保持一致。未做的补充页可作为拓展，不要求课堂逐页完成。写作保存当前浏览器，课后继续修改或下载文字。","body":["出口三句：我的……被……了。幸好……。谢谢您……。","课后教材：一2；二2、4、5、7、9；三第1组和第4组(1)；五2、3；六1(3)、六2(2)。","课后阅读：八2问答(3)—(5)；整理课堂判断题的原文依据。","课后写作：把草稿改成80字左右；完成不同国家/地区的失物处理采访。","可选拓展：补充改错、重组和对话；回听四段录音并复述故事。"]}],"media":[{"id":"taxi","title":"两万元现金，一分不少地回来了","publisher":"重庆广播电视总台 · 视界网","url":"https://www.cbg.cn/a/2025/04/02/8246ee0981b94fcc91d48d69cf6d36d2.html","task":"选看前1分钟：谁把钱还给了谁？","backup":"用课文说一句：钱被找回来了。"},{"id":"police","title":"旅客财物遗失，铁路警方协助找回","publisher":"央视网 · 第一时间","url":"https://tv.cctv.com/2025/01/01/VIDEAwaNtcNQvb90yZgXRWBc250101.shtml","task":"全片52秒：找回的物品可以怎样用被字句说明？","backup":"看图用“手机被找到了”说明结果。"},{"id":"howto","title":"坐火车遗失物品，怎样快速找回","publisher":"央视新闻","url":"https://news.cctv.c     $('#prev').onclick=()=>go(state.i-1);$('#next').onclick=()=>go(state.i+1);$('#fullscreen').onclick=()=>{const fn=document.fullscreenElement?document.exitFullscreen?.bind(document):document.documentElement.requestFullscreen?.bind(document.documentElement);if(fn)Promise.resolve(fn()).catch(()=>{})};$('#teacherSwitch').onclick=()=>{state.teacher=!state.teacher;render()};$('#resetPage').onclick=()=>{stopAudio();['choice','orders','checked','cards','prompts','polls','quiz','prep','match','matchWrong','listen','exits'].forEach(k=>delete state[k][state.i]);state.flipped[state.i]=false;render()};
    function clock(){const m=String(Math.floor(state.timer/60)).padStart(2,'0'),s=String(state.timer%60).padStart(2,'0');$('#clock').textContent=m+':'+s;$('#clock').classList.toggle('zero',state.timer===0);$('#timerPlay').textContent=state.running?'Ⅱ':'▶';$('#timerPlay').setAttribute('aria-label',state.running?'暂停计时':'开始计时')}
    let timerId=null;function runTimer(){clearInterval(timerId);if(state.running)timerId=setInterval(()=>{state.timer=Math.max(0,state.timer-1);if(state.timer===0){state.running=false;clearInterval(timerId)}clock()},1000);clock();save()}$('#timerPlay').onclick=()=>{state.running=!state.running;runTimer()};document.querySelectorAll('[data-seconds]').forEach(b=>b.onclick=()=>{state.timer=+b.dataset.seconds;state.running=false;runTimer()});$('#timerReset').onclick=()=>{state.timer=300;state.running=false;runTimer()};
    addEventListener('beforeunload',()=>{stopAudio();Object.values(audioFiles).forEach(URL.revokeObjectURL)});addEventListener('keydown',e=>{if(['INPUT','TEXTAREA','BUTTON','SELECT'].includes(document.activeElement.tagName))return;if(e.key==='ArrowRight')go(state.i+1);if(e.key==='ArrowLeft')go(state.i-1)});// The lesson keeps the original player, quiz scoring, ordering and local saving.
function markSentence(value,keys=[]){
  const terms=[...new Set(keys)].filter(Boolean).sort((a,b)=>b.length-a.length);
  if(!terms.length)return esc(value);
  const pattern=new RegExp(terms.map(x=>x.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|'),'g');
  let last=0,out='',m;while((m=pattern.exec(value))){out+=esc(value.slice(last,m.index))+'<strong class="key-red">'+esc(m[0])+'</strong>';last=m.index+m[0].length}return out+esc(value.slice(last));
}
function photoFigure(key,caption=''){
  const p=LESSON.photos[key];if(!p||!ASSETS[p.asset])return'';
  return `<figure class="photo-figure"><img src="${ASSETS[p.asset]}" alt="${esc(p.alt)}" loading="lazy"><figcaption>${esc(caption||p.caption)}</figcaption><details class="photo-credit"><summary>图片来源</summary>${p.source?`<a href="${esc(p.source)}" target="_blank" rel="noopener noreferrer">查看原图</a> · `:''}${esc(p.credit)}</details></figure>`;
}
imageView=function(s){return s.photo?photoFigure(s.photo,s.photoCaption):''};
recordedAudioView=function(s){const key=audioKey(s),src=audioSource(s);if(!key&&!src)return'';return `<section class="recorded-audio compact-audio"><div class="audio-title"><span class="audio-icon">♫</span><div><div class="audio-kicker">${audioFiles[key]?'本地录音':'教材原声'}</div><div class="audio-name">${esc(s.audioLabel||'本页录音')}</div></div></div><div class="audio-player">${src?`<audio controls preload="metadata" data-audio-key="${esc(key)}" src="${esc(src)}"></audio>`:'<p>听教师朗读。</p>'}<details class="audio-tools"><summary>更换录音</summary>${importControl(key,!!audioFiles[key])}</details></div></section>`};
cardView=function(s,i){
 const cards=s.cards||[],ci=Math.max(0,Math.min(cards.length-1,state.cards[i]||0)),c=cards[ci],flip=!!state.flipped[i];if(!c)return'';
 const covered=!!state.maskedWords[i];
 return recordedAudioView(s)+`<div class="vocab-toolbar"><span>看图 → 读词 → 写词 → 说一句</span><button class="btn" data-action="vocab-cover">${covered?'显示词语':'遮住词语，试着写'}</button></div><div class="vocab-visual ${c.photo?'':'no-photo'}">${c.photo?photoFigure(c.photo,c.photoCaption||'看图，联系词语说一句。'):''}<button class="flashcard" data-action="flip"><span class="card-term">${covered?'？ ？':esc(c.term)}</span>${!covered?`<span class="pinyin">${esc(c.pinyin)}</span>`:''}${flip?`<span class="card-meaning">${esc(c.meaning)}</span><span class="example">${esc(c.example)}</span>`:'<span class="card-hint">先猜意思，再点击看解释</span>'}</button></div><div class="card-nav"><button class="btn" data-action="card-prev">← 上一个词</button><span>${ci+1} / ${cards.length}</span><button class="btn" data-action="card-next">下一个词 →</button></div>`;
};
segmentView=function(s,i){
 const photos=s.photoPair?`<div class="story-photo-pair">${s.photoPair.map(k=>photoFigure(k,'联系图片，想一想故事中的提包。')).join('')}</div>`:imageView(s);
 return recordedAudioView(s)+`<div class="transcript">${esc(s.transcript)}</div>${photos}`+quizView(s,i);
};
function railPractice(s,i){
 if(!s.rails?.length)return'';
 return `<div class="value-banner"><b>学以致用</b><span>把汉语用在生活中，把细心带到未来岗位上。</span></div>`+s.rails.map((r,j)=>{
 const key=i+'-'+j,open=state.speaking[key];return `<section class="rail-practice"><h2>铁路情境 ${j+1} · 两人轮换说</h2>${photoFigure(r.photo,'看图模拟，练习清楚、礼貌地表达。')}<p class="situation">${esc(r.prompt)}</p><button class="btn red" data-action="rail-reveal" data-index="${j}">${open?'收起参考句':'先说一说，再看参考句'}</button>${open?`<div class="model-answer">${markSentence(r.sample,s.keys||[])}<small>${esc(r.reason)}<br>说法不止一种，意思清楚、语气合适就可以。</small></div>`:''}</section>`;
 }).join('');
}
function workshopView(s,i){
 const phase=state.workshops[i]||0,j=(state.examples[i]||0)%s.examples.length,x=s.examples[j],revealed=state.reveals[i+'-'+j];
 const tabs=['① 看情境','② 讲一讲','③ 练一练'].map((t,k)=>`<button class="work-tab ${phase===k?'active':''}" data-action="work-tab" data-value="${k}" aria-pressed="${phase===k}">${t}</button>`).join('');
 const anchor=`<div class="text-anchor"><small>回到课文</small><p>${markSentence(s.anchor,s.keys)}</p></div>`;
 let body='';
 if(phase===0)body=`<div class="context-photo">${photoFigure(x.photo,'观察图片，联系下面的情境。')}</div><div class="context-copy"><small>生活情境 ${j+1} / ${s.examples.length}</small><p class="situation">${esc(x.situation)}</p><p class="context-question">${esc(x.prompt)}</p><button class="btn red" data-action="example-reveal">${revealed?'收起参考句':'先说一说，再看参考句'}</button>${revealed?`<div class="model-answer">${markSentence(x.model,s.keys)}<small>${esc(x.reason)}</small></div>`:''}</div><div class="context-controls"><button class="btn" data-action="example-prev">← 上个情境</button><b>${j+1} / ${s.examples.length}</b><button class="btn" data-action="example-next">下个情境 →</button></div><button class="btn primary wide" data-action="work-tab" data-value="1">看过例子，讲一讲 →</button>`;
 if(phase===1)body=`<section class="grammar-board"><b>这样说</b><div class="formula">${esc(s.grammar.pattern)}</div></section><p class="plain-meaning">${esc(s.grammar.meaning)}</p>${s.grammar.details?.length?`<div class="rule-details">${s.grammar.details.map(t=>`<p>${markSentence(t,s.keys)}</p>`).join('')}</div>`:''}<div class="grammar-warning">${esc(s.grammar.warning)}</div><section class="all-examples"><h2>刚才的四个情境，一起看</h2>${s.examples.map((e,n)=>`<div class="example-row"><span class="num">${n+1}</span><div><p>${markSentence(e.model,s.keys)}</p><small>${esc(e.reason)}</small></div></div>`).join('')}</section><section class="book-explanation"><h2>课本原来的解释与例句</h2><p>${markSentence(s.textbook,s.keys)}</p>${s.bookExamples.map(e=>`<blockquote>${markSentence(e,s.keys)}</blockquote>`).join('')}</section>${s.bookPages.map(p=>`<details class="book-page"><summary>查看教材第${p}页</summary><img src="${ASSETS['book'+p]}" alt="教材第${p}页原页" loading="lazy"></details>`).join('')}<button class="btn primary wide" data-action="work-tab" data-value="2">明白了，练一练 →</button>`;
 if(phase===2)body=quizView(s,i)+railPractice(s,i);
 return anchor+`<div class="work-tabs">${tabs}</div><section class="work-content phase-${phase}">${body}</section>`;
}
function mediaView(s,i){
 return (s.media||[]).map(m=>`<section class="official-media"><div class="media-tag">官方短视频 · 联网观看</div>${photoFigure(m.id==='taxi'?'taxi':m.id==='police'?'railLostFound':'railLuggageBay',m.id==='taxi'?'从课文走进真实生活':'用所学句型说一说身边的服务。')}<h2>${esc(m.title)}</h2><small>${esc(m.publisher)}</small><p class="viewing-task">${esc(m.task)}</p><a class="btn primary video-link" href="${esc(m.url)}" target="_blank" rel="noopener noreferrer">打开官方视频 ↗</a><details class="offline-task"><summary>看完后说一句／离线备用</summary><p>${esc(m.backup)}</p></details></section>`).join('')+railPractice(s,i);
}
function recapView(s){return `<div class="recap-grid">${s.items.map(x=>`<button class="recap-card" data-action="grammar-jump" data-value="${slides.findIndex(y=>y.kind==='workshop'&&y.title===x.title)}"><b>${esc(x.title)}</b><p>${esc(x.meaning)}</p><span>${esc(x.example)}</span><small>再看例句与练习 →</small></button>`).join('')}</div>`}
const originalActivity=activity;
activity=function(s,i){return s.kind==='workshop'?workshopView(s,i):s.kind==='media'?mediaView(s,i):s.kind==='recap'?recapView(s):originalActivity(s,i)};
document.addEventListener('click',e=>{
 const b=e.target.closest('button[data-action]');if(!b)return;const a=b.dataset.action;
 if(!['work-tab','example-prev','example-next','example-reveal','rail-reveal','vocab-cover','grammar-jump','lesson-reset'].includes(a))return;
 e.stopImmediatePropagation();const i=state.i,s=slides[i];
 if(a==='lesson-reset'){stopAudio();for(const k of ['choice','orders','checked','cards','flipped','prompts','polls','quiz','prep','match','matchWrong','listen','exits','workshops','examples','reveals','speaking','maskedWords'])state[k]={};state.teacher=false;state.timer=300;state.running=false;runTimer();go(0);return}
 if(a==='grammar-jump'){go(+b.dataset.value);return}
 if(a==='work-tab')state.workshops[i]=+b.dataset.value;
 if(a==='example-prev')state.examples[i]=((state.examples[i]||0)-1+s.examples.length)%s.examples.length;
 if(a==='example-next')state.examples[i]=((state.examples[i]||0)+1)%s.examples.length;
 if(a==='example-reveal'){const k=i+'-'+(state.examples[i]||0);state.reveals[k]=!state.reveals[k]}
 if(a==='rail-reveal'){const k=i+'-'+b.dataset.index;state.speaking[k]=!state.speaking[k]}
 if(a==='vocab-cover')state.maskedWords[i]=!state.maskedWords[i];
 render();
},true);
const originalReset=$('#resetPage').onclick;
$('#resetPage').onclick=()=>{const i=state.i;delete state.workshops[i];delete state.examples[i];delete state.maskedWords[i];for(const field of ['reveals','speaking'])for(const k of Object.keys(state[field]))if(k.startsWith(i+'-'))delete state[field][k];originalReset()};

clock();render();
  
</script>
